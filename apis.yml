name: MAYD
description: >-
  MAYD (Meds At Your Doorstep) is a Berlin-based on-demand medication delivery
  service building a digital healthcare platform for Europe. Founded in 2021 by
  Hanno Heintzenberg and Lukas Pieczonka (previously McMakler), MAYD partners
  with local pharmacies to deliver over-the-counter and prescription medications
  to consumers' doors in about 30 minutes, 365 days a year, across German cities
  including Berlin, Hamburg, Munich, Frankfurt, Cologne and Düsseldorf. The
  company operates a consumer mobile app and website (getmayd.com) and raised a
  ~EUR 30M Series A led by Lightspeed Venture Partners in January 2022, with
  participation from Target Global, 468 Capital and Earlybird Venture Capital.
  MAYD is a consumer-facing (B2C) delivery business and does not currently
  publish a public developer API, developer portal, or partner API surface; it
  is a Stripe payments customer for its checkout and billing.
